<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Récupération - KMD WALLPAPER</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: white; color: #111; font-family: system-ui, -apple-system, Arial, sans-serif; transition: 0.3s; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 450px; width: 90%; text-align: center; }
.card h1 { color: #2563eb; margin-bottom: 10px; display:flex; align-items:center; justify-content:center; gap:10px; }
.card p { color: #666; margin-bottom: 30px; }
form input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
.btn { background: #2563eb; color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; border: none; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
.btn:hover { background: #1e40af; }
.back-link { display: block; margin-top: 20px; color: #2563eb; text-decoration: none; }
.success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; }
body.dark { background: #0a0a0a; color: #eee; }
body.dark.card { background: #111; }
body.dark form input { background: #222; border-color: #333; color: #eee; }
</style>
</head>
<body>
  <div class="card">
    <h1><i data-lucide="key-round"></i> Mot de passe oublié</h1>
    <p>Entre ton email et on t'enverra ton mot de passe</p>

    <form id="forgotForm">
      <input type="email" id="forgotEmail" placeholder="Ton email" required>
      <button type="submit" class="btn"><i data-lucide="mail"></i> Envoyer mon mot de passe</button>
    </form>

    <p id="successMsg" class="success">Demande envoyée! Vérifie tes emails sous 24h</p>

    <a href="contact.html" class="back-link"><i data-lucide="arrow-left"></i> Retour</a>
  </div>

<script>
lucide.createIcons();

// MODE SOMBRE
if(localStorage.getItem('theme') === 'dark'){ document.body.classList.add('dark'); }

document.getElementById('forgotForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('forgotEmail').value;
  let users = JSON.parse(localStorage.getItem('kmd_users_data') || '{}');

  if(!users[email]) {
    alert("Cet email n'existe pas dans notre base");
    return;
  }

  const password = users[email].password;

  // ENVOIE LE MDP A TOI PAR EMAIL
  fetch("https://formsubmit.co/ajax/supportkmdwallpaper@gmail.com", {
    method: "POST",
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      _subject: "Demande de mot de passe - " + email,
      message: `L'utilisateur ${email} a demandé son mot de passe.\n\nSon mot de passe est: ${password}\n\nRéponds-lui par email.`,
    })
  }).then(() => {
    document.getElementById('successMsg').style.display = 'block';
    document.getElementById('forgotForm').reset();
  });
});
</script>
</body>
</html>
